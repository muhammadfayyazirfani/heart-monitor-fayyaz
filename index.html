<!doctype html>
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta charset="utf-8">
  <title>Heart Monitor (Cloud)</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{font-family:Arial;padding:16px;max-width:900px;margin:auto}
    #bpmBig{font-size:36px;font-weight:700;margin-bottom:8px}
  </style>
</head>
<body>
  <h1>AI-Style Heart Monitor</h1>
  <div id="bpmBig">-- BPM</div>
  <canvas id="chart" width="800" height="300"></canvas>
  <div style="margin-top:8px">
    <button id="startSession">Start Session</button>
    <button id="stopSession" disabled>Stop & Save</button>
    <select id="label">
      <option value="resting">Resting</option>
      <option value="exercise">Exercise</option>
      <option value="sleep">Sleep</option>
    </select>
    <button id="exportCSV">Export CSV</button>
    <button id="exportPNG">Export PNG</button>
  </div>

<script>
  const firebaseConfig = {
    databaseURL: "https://heart-monitor-fayyaz-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const DEVICE = "device01";

  // Chart setup
  const ctx = document.getElementById('chart').getContext('2d');
  const labels = [], data = [];
  const myChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ label: 'BPM', data, borderColor:'red', fill:false }] },
    options: { animation:false, scales:{ y:{ min: 30, max: 200 } } }
  });

  // Session handling
  let sessionId = null;
  let sessionData = [];

  document.getElementById('startSession').onclick = () => {
    sessionId = 's_'+Date.now();
    sessionData = [];
    document.getElementById('stopSession').disabled = false;
  };
  document.getElementById('stopSession').onclick = async () => {
    document.getElementById('stopSession').disabled = true;
    const label = document.getElementById('label').value;
    await db.ref('sessions/'+DEVICE+'/'+sessionId).set({ label, start: sessionId.split('_')[1], readings: sessionData });
    alert('Session saved.');
  };

  // listen to new readings in realtime
  db.ref('readings/'+DEVICE).limitToLast(100).on('child_added', snap => {
    const v = snap.val();
    if(!v) return;
    const ts = v.ts || Date.now();
    const bpm = Number(v.bpm) || 0;
    document.getElementById('bpmBig').innerText = bpm + ' BPM';
    labels.push(new Date(ts).toLocaleTimeString());
    data.push(bpm);
    if(labels.length>60){labels.shift();data.shift()}
    myChart.update();
    if(sessionId) sessionData.push({ts,bpm});
  });

  // Export CSV
  document.getElementById('exportCSV').onclick = async () => {
    const snap = await db.ref('readings/'+DEVICE).once('value');
    const rows = [['timestamp','bpm']];
    snap.forEach(child=>{
      const r = child.val();
      rows.push([new Date(r.ts).toISOString(), r.bpm]);
    });
    const csv = rows.map(r=>r.join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'readings.csv'; a.click();
  };

  // Export PNG
  document.getElementById('exportPNG').onclick = () => {
    const url = myChart.toBase64Image();
    const a = document.createElement('a'); a.href = url; a.download = 'chart.png'; a.click();
  };
</script>
</body>
</html>
