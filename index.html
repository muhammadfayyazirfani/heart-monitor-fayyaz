<!DOCTYPE html>
<html>
<head>
  <title>Meet Pulse AI</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
    h2 { margin-bottom: 10px; }
    #chartContainer { width: 90%; max-width: 600px; }
    #currentHR { margin-top: 10px; font-size: 1.5em; font-weight: bold; text-align: center; }
    button, select { margin: 5px; padding: 6px 12px; }
  </style>
</head>
<body>
  <h2>Meet Pulse AI</h2>
  <div id="chartContainer">
    <canvas id="hrChart"></canvas>
    <div id="currentHR">Current Heart Rate: -- BPM</div>
  </div>

  <div>
    <button id="startSession">Start Session</button>
    <button id="stopSession" disabled>Stop & Save</button>
    <select id="label">
      <option value="resting">Resting</option>
      <option value="exercise">Exercise</option>
      <option value="sleep">Sleep</option>
    </select>
    <button id="exportCSV">Export CSV</button>
    <button id="exportPNG">Export PNG</button>
  </div>

<script>
  const firebaseConfig = { databaseURL: "https://heart-monitor-fayyaz-default-rtdb.firebaseio.com/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const DEVICE = "device01";

  const ctx = document.getElementById('hrChart').getContext('2d');
  const labels = [], data = [];
  const hrChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ label:'BPM', data, borderColor:'red', fill:false }] },
    options: { animation:false, scales:{ y:{ min:30, max:200 } } }
  });

  let sessionId = null, sessionData = [];

  document.getElementById('startSession').onclick = () => {
    sessionId = 's_'+Date.now();
    sessionData = [];
    document.getElementById('stopSession').disabled = false;
  };

  document.getElementById('stopSession').onclick = async () => {
    document.getElementById('stopSession').disabled = true;
    const label = document.getElementById('label').value;
    await db.ref('sessions/'+DEVICE+'/'+sessionId).set({ label, start: sessionId.split('_')[1], readings: sessionData });
    alert('Session saved.');
  };

  db.ref('readings/'+DEVICE).limitToLast(100).on('child_added', snap => {
    const v = snap.val();
    if(!v) return;
    const ts = v.ts || Date.now();
    const bpm = Number(v.bpm) || 0;
    document.getElementById('currentHR').innerText = 'Current Heart Rate: ' + bpm + ' BPM';
    labels.push(new Date(ts).toLocaleTimeString());
    data.push(bpm);
    if(labels.length>60){ labels.shift(); data.shift(); }
    hrChart.update();
    if(sessionId) sessionData.push({ts,bpm});
  });

  document.getElementById('exportCSV').onclick = async () => {
    const snap = await db.ref('readings/'+DEVICE).once('value');
    const rows = [['timestamp','bpm']];
    snap.forEach(child => { const r = child.val(); rows.push([new Date(r.ts).toISOString(), r.bpm]); });
    const csv = rows.map(r=>r.join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'readings.csv'; a.click();
  };

  document.getElementById('exportPNG').onclick = () => {
    const url = hrChart.toBase64Image();
    const a = document.createElement('a'); a.href = url; a.download = 'chart.png'; a.click();
  };
</script>
</body>
</html>
